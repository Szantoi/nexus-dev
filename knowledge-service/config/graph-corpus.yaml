# Tudásgráf-korpusz: melyik sziget MIT indexel a gráfba.
#
# A gráf-réteg sziget- és projekt-agnosztikus (a store, az MCP toolok és az
# extractorok semmit nem tudnak konkrét repóról) — egy másik kódbázis vagy egy
# új nyelv bekötése ITT történik, nem a kódban.
#
#   repo_root           : abszolút út, VAGY a nexus-dev repó gyökeréhez képest
#                         relatív. Minden entitás-id ehhez képest relatív.
#   sources[].path      : repo_root-hoz képest relatív (nem szökhet ki alóla)
#   sources[].extractor : a regiszterben létező extractor neve
#                         (src/knowledgeGraph/extractors/registry.ts):
#                         markdown | typescript | csharp | coverage
#
# GÉPFÜGGŐ SZIGETEK: ez a fájl gitre kerül, a checkoutok viszont gépenként
# mások. Ha egy korpusz csak egy adott gépen létezik, a `repo_root` egy
# KÖRNYEZETI VÁLTOZÓRA hivatkozzon (`${JOINERYTECH_ROOT}`): ahol a változó be
# van állítva, ott a sziget indexelhető, ahol nincs, ott a `--all-islands`
# futás átugorja (a `--island <név>` viszont hangosan hibázik). Így a
# sziget-lista hivatalos és megosztott marad, a gépfüggő út nélkül.
#
# SZIGET-MODELL (Gábor, 2026-07-25): a `spaceos` a KÖZPONTI TUDÁSTÁR, amivel a
# fejlesztések indultak — nem termék. Alóla váltak ki a termékek: kernel,
# joinerytech, nexus; jelenleg a joinerytech-ből szerveződik ki az ERP. Új
# termék = új sziget + egy bejegyzés ide.
#
# Fail-closed: ha egy szigethez nincs bejegyzés, az indexelés HIBA — nem üres
# indexelés (az kisöpörné az adott sziget gráfját). Ugyanígy hiba, ha egy
# forrás 0 entitást ad (elgépelt/üres/olvashatatlan fa): a testvér-források
# épsége nem söpörheti ki a hiányzó forrás részgráfját.
#
# A források FÜGGETLENÜL futnak: él csak egy forráson BELÜL keletkezik. Ha egy
# fát két bejegyzésre bontasz, a köztük futó importok nem lesznek élek —
# egy fát egy bejegyzésként vegyél fel.
#
# Indexelés:  npm run graph:index -- --island <sziget>
islands:
  # A Nexus önmagát indexeli: a saját dokumentációja + a knowledge-service
  # forrása. Ez ma az alapértelmezett sziget (ISLAND_ID env, default: spaceos)
  # — a Nexus önálló szigetre mozgatása a runner/identitás-oldallal együtt jön.
  spaceos:
    repo_root: "."
    sources:
      - path: docs
        extractor: markdown
      - path: knowledge-service/src
        extractor: typescript
      # A `coverage` extractor (teszt→kód COVERS élek) SZÁNDÉKOSAN nincs még
      # bekötve: a coverage-final.json gitignore-olt és gépfüggő — a VPS-timer
      # spaceos-futása fail-closed elhasalna rajta, két gép eltérő coverage-e
      # pedig fingerprint/sweep-divergenciát okozna. Bekötés csak a
      # sweep-kompatibilis terv (@root kapu) után.

  # JoineryTech: a C#-kódbázis + a saját dokumentációja. A checkout csak azon a
  # gépen van meg, ahol a JOINERYTECH_ROOT be van állítva (a VPS-en
  # /opt/joinerytech) — máshol a `--all-islands` futás átugorja.
  joinerytech:
    repo_root: "${JOINERYTECH_ROOT}"
    sources:
      - path: src
        extractor: csharp
      - path: docs
        extractor: markdown
