# CI — knowledge-service quality gates (TASK-QC-005)
#
# Every gate is a package script, so CI and local runs are identical.
# To reproduce ANY failing gate locally, run the same script from
# knowledge-service/ (see the per-step comments below).
#
#   Gate            | Local reproduction (cd knowledge-service)
#   ----------------|-------------------------------------------------------
#   Typecheck       | npm run typecheck
#   Build (tsc emit)| npm run build
#   Lint ratchet    | npm run lint:ratchet   (details: npm run lint)
#   File size gate  | npm run check:size     (= node ../scripts/check-file-size.mjs)
#   Tests+coverage  | npm run test:coverage
#   Prod dep audit  | npm run audit:prod
#   Secret scan     | npm run secret-scan    (= node ../scripts/secret-scan.mjs)
#   Doc link check  | npm run check:links    (= node ../scripts/check-doc-links.mjs)
#   Task schema gate| npm run check:tasks    (= node ../scripts/check-tasks.mjs, TASK-DP-003)
#   Gate-script test| npm run test:tasks     (node:test suite of the gate scripts)
#   Worktree gate   | npm run gate:worktree:snapshot / gate:worktree:verify
#   Native PTY      | npm run smoke:pty     (Windows ConPTY + Linux forkpty matrix)
#
# ONE-COMMAND local equivalent of the full suite (TASK-DP-007): npm run gate
#
# Gate semantics:
#   - Lint ratchet: Biome errors always fail; the warning count may not exceed
#     the baseline in knowledge-service/.lint-baseline.json (ratchet: it may
#     only go down — lower it with `node scripts/lint-ratchet.mjs --update`).
#   - Coverage: global thresholds live in knowledge-service/vitest.config.ts
#     (coverage.thresholds). They are a floor: raising them is TASK-QC-006's
#     job; lowering requires a documented ADR.
#   - Audit: production dependencies only; high/critical advisories block.
#
# RELEASE GATE (not run here): live-server smoke tests — `npm run test:smoke`
# (vitest.smoke.config.ts). They need a booted knowledge-service + ChromaDB +
# a real terminal file tree, so they are a MANDATORY manual release gate run
# against dev/prod before deploying, not a hermetic CI job.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: every gate only reads the checkout.
permissions:
  contents: read

# One run per ref; superseded runs are cancelled to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The exact same Linux-generated lockfile must install and run the native PTY
  # contract on both supported runner platforms. The smoke covers spawn,
  # unicode/space cwd, resize, input and descendant process-tree shutdown.
  native-pty-platform:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: knowledge-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: knowledge-service/package-lock.json

      # GitHub-hosted Windows images include Python and Visual Studio C++ build
      # tools. Ubuntu packages are explicit so source-build fallback stays
      # deterministic if an upstream prebuild is unavailable.
      - name: Install native build prerequisites (Linux fallback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y make g++ python3

      - name: Install exact Linux-generated lockfile
        run: npm ci --prefer-offline

      # TASK-DP-007 review P3: the PTY smoke must not dirty the repo either
      # (same snapshot/verify pair as the main gate job, ignored paths too).
      - name: Worktree snapshot (before smoke)
        run: npm run gate:worktree:snapshot

      - name: Native PTY contract smoke
        run: npm run smoke:pty

      - name: Worktree must be unchanged after the smoke
        run: npm run gate:worktree:verify

  # TASK-DP-007: the FULL gate suite runs on BOTH supported platforms from the
  # same commit — green only means merge-ready if Windows and Linux agree.
  # Check-run names are 'knowledge-service (ubuntu-latest)' and
  # 'knowledge-service (windows-latest)' — the branch-protection draft
  # (docs/tasks/development-process/TASK-DP-006-branch-protection-config.json)
  # lists both as required contexts.
  knowledge-service:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: knowledge-service
    steps:
      # fetch-depth: 2 (not the default shallow depth-1 clone) — the task
      # schema gate's status-transition check (TASK-DP-003) diffs against an
      # explicit base (see the "Task schema and consistency gate" step below):
      # on push HEAD~1 (needs the parent commit → depth 2), on pull_request
      # the PR base sha (the synthetic merge commit's first parent, also
      # present at depth 2). check-tasks.mjs fail-closes if the explicit base
      # cannot be resolved, so a depth/semantics regression turns the gate
      # RED instead of silently skipping the transition check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge-service/package-lock.json

      # TASK-DP-007: every run records the exact toolchain, so a red/green
      # difference between platforms is attributable to a concrete version.
      - name: Record platform and toolchain versions
        run: |
          echo "os=${{ runner.os }}"
          node --version
          npm --version
          git --version

      - name: Install
        run: npm ci --prefer-offline

      # Local repro: npm run typecheck
      - name: Typecheck
        run: npm run typecheck

      # Local repro: npm run build — a clean checkout must COMPILE, not just
      # typecheck (tsc --noEmit skips emit-only failures). dist/ is gitignored,
      # so this does not dirty the worktree-clean gate below.
      - name: Build
        run: npm run build

      # TASK-DP-007 (review P1 fix): the worktree gate is snapshot/verify and
      # watches IGNORED paths too (git status --porcelain --ignored=matching) —
      # a test writing into gitignored runtime dirs (knowledge-service/data/,
      # terminal state) must fail the gate, not hide behind .gitignore.
      # Snapshot AFTER install+build so node_modules/dist are in the baseline;
      # coverage/ is an allowlisted expected output (see check-worktree.mjs).
      - name: Worktree snapshot (before the test-running gates)
        run: npm run gate:worktree:snapshot

      # Local repro: npm run lint:ratchet (rule details: npm run lint)
      - name: Lint ratchet (errors fail, warning count may not grow)
        run: npm run lint:ratchet

      # Local repro: npm run check:size (= node ../scripts/check-file-size.mjs)
      # Production TS files max 800 lines; documented exceptions with expiry +
      # owner live in knowledge-service/.file-size-allowlist.json (TASK-QC-008).
      - name: File size gate (800-line limit, dated allowlist)
        run: npm run check:size

      # Local repro: npm run test:coverage
      # Hermetic suite + global coverage thresholds (vitest.config.ts).
      - name: Hermetic tests + coverage floor
        run: npm run test:coverage

      # Local repro: npm run audit:prod
      - name: Audit production dependencies (high/critical block)
        run: npm run audit:prod

      # Local repro: npm run secret-scan (config: .secret-scan.json, repo root)
      - name: Secret scan (tracked files)
        run: npm run secret-scan

      # Local repro: npm run check:links
      - name: Documentation link check
        run: npm run check:links

      # Local repro: npm run check:tasks (= node ../scripts/check-tasks.mjs)
      # Task-frontmatter schema, DAG, EPICS.yaml membership and archive-
      # invariant gate (TASK-DP-003, docs/tasks/task-schema.json).
      # TASK-DP-007 (review P2 fix): the diff base is EXPLICIT here — on
      # pull_request the PR base sha (HEAD is a synthetic merge commit whose
      # first parent is the base tip, present at fetch-depth 2), on push
      # HEAD~1. check-tasks.mjs fail-closes on an unresolvable explicit base,
      # so the status-transition check can no longer silently skip in CI.
      - name: Task schema and consistency gate
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$PR_BASE" ]; then
            npm run check:tasks -- --diff-base "$PR_BASE"
          else
            npm run check:tasks -- --diff-base HEAD~1
          fi

      # TASK-DP-007 (review P2 fix): the gate scripts' own node:test suite
      # (check-tasks, lint-ratchet expiry invariants, worktree gate) — a
      # reordering inside a gate script must fail CI, not wait for the first
      # real expiry in production.
      - name: Gate-script unit and integration tests
        run: npm run test:tasks

      # TASK-DP-007: a hermetic suite must leave the repository untouched — a
      # test that writes into the worktree (data/, terminal state, fixtures)
      # passes locally by accident and poisons every later gate. Fail closed
      # on ANY tracked modification, new untracked file OR new ignored path
      # (review P1 fix: plain `git status --porcelain` was blind to gitignored
      # runtime dirs like knowledge-service/data/). Local repro: npm run gate.
      - name: Worktree must be unchanged after the full gate suite
        run: npm run gate:worktree:verify

      # TASK-DP-007: on failure, archive the machine-readable outputs needed
      # to diagnose without re-running (coverage report, npm debug logs).
      # Secrets cannot reach these artifacts: the secret-scan gate runs on the
      # same tree, and coverage/logs contain only repo-derived content.
      - name: Archive failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-${{ matrix.os }}-${{ github.run_id }}
          # npm debug logs live under ~/.npm on Linux but under
          # %LOCALAPPDATA%\npm-cache on Windows (review P2 fix: the old
          # Linux-only path silently uploaded nothing on the Windows leg).
          # coverage-summary.json exists because vitest.config.ts includes the
          # 'json-summary' reporter.
          path: |
            knowledge-service/coverage/coverage-summary.json
            knowledge-service/coverage/coverage-final.json
            ~/.npm/_logs/
            ~/AppData/Local/npm-cache/_logs/
          if-no-files-found: ignore
          retention-days: 7
