# ─── JAVASOLT COMMIT-SORREND (függőség és rollback-határ szerint) ──────────
commit_plan:
  ordering_rationale: >
    A sorrend úgy épül, hogy (1) a biztonság- és titok-érzékeny, alacsony
    kockázatú alapozás menjen elsőként, (2) a dokumentáció-only csoportok
    bármikor közbeékelhetők kockázat nélkül, (3) a nagy, egymásra épülő
    forráskód-csoportok (config-centralizáció → tesztek → dokumentáció)
    logikus épülési sorrendben kövessék egymást, (4) mind a NÉGY,
    `needs_human_gate: true` jelölésű lépés (1. QC-003 — .env.dev
    git-index törlés; 12. SECURITY-HARDENING — alapértelmezés-váltás;
    14. UNCLEAR-DEPENDENCY-OVERRIDE — protobufjs override szándéka;
    15. UNCLEAR-AGENT-TOOLING — ismeretlen eredetű skill) explicit
    jóváhagyás nélkül NE kerüljön push-ra — ez a szám korábban tévesen
    "két csoport"-ként volt leírva egy független reviewer 2026-07-18-i
    észrevétele nyomán javítva NÉGYRE —, (5) a QC ledger-zárás (EPICS.yaml
    + todo.md QC-szakasz) legyen az utolsó QUALITY-commit, mert az
    deklarálja a programot késznek — csak azután van értelme, hogy a
    mögöttes 1-9. commit ténylegesen megtörtént, és (6) a
    DP-ISL-ARCHITECTURE-ADRS csoport (16. lépés) NEM ennek a tasknak a
    commitja — a saját TASK-DP-002/TASK-ISL-001 reviewer-lánca dönt róla,
    ezért nincs `needs_human_gate` jelölése ebben a sequence-ben (más
    task felelőssége).
  sequence:
    - {step: 1, group: QC-003, needs_human_gate: true, reason: ".env.dev git-index törlés megerősítése"}
    - {step: 2, group: QC-002, needs_human_gate: false}
    - {step: 3, group: QC-005, needs_human_gate: false, note: "package.json-t protobufjs-override NÉLKÜL commitolni (patch-split)"}
    - {step: 4, group: QC-008, needs_human_gate: false, note: "nagy mcp.ts diff — javasolt külön feature-branch-en futtatni a teljes suite-ot pusholás előtt"}
    - {step: 5, group: QC-004, needs_human_gate: false}
    - {step: 6, group: QC-007, needs_human_gate: false, note: "env.ts-t a security-hunkok NÉLKÜL (patch-split)"}
    - {step: 7, group: QC-006, needs_human_gate: false, note: "tokenAuth.test.ts/appSecurity.test.ts/envSecurity.test.ts tényleges hovatartozása a SECURITY-HARDENING döntéstől függ — lehet, hogy ezekkel együtt csúszik a 12. lépésre"}
    - {step: 8, group: QC-009, needs_human_gate: false}
    - {step: 9, group: QC-010, needs_human_gate: false}
    - {step: 10, group: QC-FOLLOWUP-BACKLOG, needs_human_gate: false}
