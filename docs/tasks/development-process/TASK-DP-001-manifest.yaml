# ─── BASELINE HELYREÁLLÍTÁSI / ÖSSZEHASONLÍTÁSI ELJÁRÁS ────────────────────
restore_and_compare_procedure:
  current_state_is_not_a_commit: >
    FONTOS: ennek a baseline-nak NINCS commit-azonosítója — maga a piszkos
    munkafa a "baseline". `git stash` vagy `git reset --hard` NEM használható
    biztonságos visszaállításra, mert az elveszítené pontosan azt az
    anyagot, amit ez a leltár rögzít. A task scope-ja kifejezetten tiltja
    az automatikus visszaállítást/stash-t/mozgatást.
  how_to_compare_a_future_state_to_this_baseline:
    - "git status --porcelain=v1 -uall > current-status.txt; diff current-status.txt <ebben-a-manifestben-rögzített-258-soros-lista> — ha eltér, valami módosult a leltár óta."
    - "git diff --stat / git diff --cached --stat összevetése a fenti diffstat_unstaged_summary / diffstat_staged_summary értékekkel."
    - "node scripts/secret-scan.mjs újrafuttatása minden állapotváltás után (jelenlegi baseline: 0 találat, 347 fájl)."
  freshness_warning: >
    KÖTELEZŐ, NEM OPCIONÁLIS FIGYELMEZTETÉS (a 2026-07-18-i 1. körös
    független review nyomán): ez a manifest egy ÉLŐ, több agent által
    EGYIDEJŰLEG szerkesztett munkafa pillanatfelvétele. A v1.0 verzió
    (11:24:58) a generálás pillanatában 247/247 igazoltan pontos volt, de
    ~30 perccel később egy független reviewer saját `git status`-futtatása
    már 258 sort talált (10 új ADR a párhuzamosan futó TASK-DP-002/
    TASK-ISL-001-től + a manifest saját maga) — ezt a v1.1 javította. Ez A
    MINTA MEGISMÉTLŐDHET: mire a `TASK-DP-006` (change-provenance) vagy
    bármely más downstream fogyasztó ezt a manifestet használni akarja,
    KÖTELEZŐ előbb újrafuttatni a `git status --porcelain=v1 -uall`-t és
    összevetni a jelen szakasz elején leírt módszerrel — ha eltérés van,
    a manifestet frissíteni kell (új csoport a friss fájloknak, vagy teljes
    regenerálás), MIELŐTT bármilyen commit-döntés erre a manifestre épül.
    A puszta létezés nem elég; minden felhasználás előtt friss egyeztetés
    kell.
  how_to_make_this_baseline_durably_recoverable:
    recommended: >
      A LEGGYORSABB módja, hogy ez a munka ne vesszen el, ha a commit_plan
      szerinti commitsorozat végrehajtódik (lásd human_gate pontok). Amíg ez
      nem történik meg, az EGYETLEN példány a munkafa ez a Windows-gépen élő
      állapota.
    non_destructive_backup_alternative: >
      Ha commit előtt mégis biztonsági másolat kell: fájlrendszer-szintű
      másolat (pl. `robocopy /MIR` egy külön mappába), NEM git-stash — a
      git-stash egy git-objektum-műveletet igényel, amit ez a task nem
      engedélyez felhasználói jóváhagyás nélkül. Ezt a manifestet készítő
      agent NEM hajtott végre ilyen másolást (scope-on kívül); ez emberi
      döntésre vár.
    optional_patch_snapshot: >
      Ha valaki egy önálló, olvasható pillanatképet akar a teljes diffről
      anélkül, hogy bármit commitolna: `git diff > <útvonal-a-repon-kívül>`
      és `git diff --cached > <útvonal-a-repon-kívül>` — SZÁNDÉKOSAN NEM
      futtattam le ezt a repo-n belülre, hogy ne növeljem tovább a 247
      bejegyzést egy 248.-kal; ha kell, a fájlt a repo-n KÍVÜLI útvonalra
      célszerű írni.
