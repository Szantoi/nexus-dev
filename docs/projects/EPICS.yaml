# EPICS.yaml — Nexus-dev program állapot (QUALITY.md 1. pont: goal-fókusz)
#
# ─── KANONIKUS ÁLLAPOTFORRÁS ÉS SZINKRON-ELJÁRÁS (TASK-QC-001) ───────────────
#
# Kanonikus forrás szintenként:
#   - program / mérföldkő / epic szint: EZ A FÁJL (docs/projects/EPICS.yaml)
#   - task szint:                       a task-fájl frontmattere (`status` mező),
#                                       pl. docs/tasks/quality-compliance/TASK-QC-*.md
#   - emberi munkanapló (ledger):       terminals/root/todo.md
#
# Szinkron-eljárás (minden task zárásának része):
#   1. A worker a task-fájl frontmatter `status` mezőjét állítja (ready → done /
#      blocked), és a fájl végére Implementáció-szekciót ír bizonyítékokkal.
#   2. Ha az epic MINDEN taskja done → az epic `status` mezője itt done-ra vált.
#      Ha egy mérföldkő minden epicje done ÉS az `acceptance` feltétele
#      bizonyított → a mérföldkő `status` mezője done-ra vált.
#   3. A terminals/root/todo.md ledgerbe dátumozott Kész-sor kerül.
#   4. Az `updated` mező frissül. Eltérés esetén a frissebb, bizonyítékkal
#      alátámasztott forrás (task-fájl / ledger) nyer, és ezt a fájlt kell
#      hozzáigazítani — nem fordítva.
#
# ─── SÉMA ────────────────────────────────────────────────────────────────────
# TypeScript-séma: knowledge-service/src/graph/types.ts
#   (EpicsYaml / ProgramDefinition / ProgramMilestone / EpicDependency)
# Validátor: knowledge-service/src/pipeline/epicsValidator.ts — az ismeretlen
#   mezőket nem hibáztatja, ezért a bővítés ADDITÍV: régi parser nem törik.
#
# Hierarchia (QUALITY.md 1. pont): program → projekt → mérföldkő → epic → task.
#   programs[]:              program-szintű mérhető cél (goal) + leállási
#                            feltétel (stopping_condition) + mérföldkövek
#   programs[].milestones[]: mérhető elfogadási feltétellel (acceptance)
#   epics[].program:         melyik programhoz tartozik az epic
#   epics[].milestone:       melyik mérföldkőben ZÁRUL az epic
#   epics[].tasks[]:         task-id + fájl (a task-állapot a frontmatterben él,
#                            itt nem duplikáljuk — egy forrás szintenként)
#   epics[].tasks_yaml:      task-index / ledger útvonala (kötelező mező, E10)
#
# Cél: a projekt állapota fájlban él, nem a beszélgetés-kontextusban.

version: "1.1"
