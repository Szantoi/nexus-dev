# Temporary, single-terminal VPS canary configuration. Contains no secrets.
server_url: http://127.0.0.1:3458
token_env: NEXUS_AGENT_TOKEN_EXPLORER
poll_interval_ms: 5000
sse_enabled: true
max_backoff_ms: 300000
max_attempts: 3
retry_cooldown_ms: 600000
quarantine_existing_on_first_start: true
session_timeout_ms: 3600000
max_output_bytes: 10485760
shutdown_grace_ms: 47000
mcp_server_name: joinerytech
default_provider: codex
providers:
  codex:
    # Stable launcher: Codex updates versioned releases beneath ~/.codex.
    binary: /home/gabor/.local/bin/codex
    auth_env_var: NEXUS_AGENT_TOKEN
    sandbox: read-only
    ephemeral: true
    skip_git_repo_check: true
    extra_args:
      - -c
      - approval_policy="never"
      - -c
      - mcp_servers.spaceos-knowledge.enabled=false
      - -c
      - features.apps=false
      - -c
      - mcp_servers.joinerytech.url="http://127.0.0.1:3458/mcp"
      - -c
      - mcp_servers.joinerytech.bearer_token_env_var="NEXUS_AGENT_TOKEN"
      - -c
      - mcp_servers.joinerytech.default_tools_approval_mode="approve"
log_dir: /opt/joinerytech/logs/codex-runner
expected_island_id: joinerytech
attached_defaults:
  startup_timeout_ms: 30000
  ready_confirm_samples: 2
  idle_settle_ms: 1500
  idle_confirm_samples: 2
  completion_idle_timeout_ms: 30000
  task_stall_timeout_ms: 600000
  cols: 120
  rows: 36
terminals:
  explorer:
    workdir: /opt/joinerytech/terminals/explorer
    provider: codex
    # Temporary recovery path: Codex's interactive TUI does not reach a
    # prompt on this VPS. `codex exec --json` keeps the same read-only model
    # and MCP scope, but reports structured lifecycle events without a PTY.
    mode: headless
    # Explicit canary gate: an empty list leaves the recovered runner safely
    # paused until a newly created, named test message is authorised here.
    allowed_message_ids: []
    models: [gpt-5.6-terra]
    default_model: gpt-5.6-terra
    credential_env: NEXUS_AGENT_TOKEN_EXPLORER
    additional_write_dirs: []
    attached:
      ready_pattern: '.*› .*gpt-5\.6-terra medium .*/opt/joinerytech/terminals/explorer$'
      idle_pattern: '.*› .*gpt-5\.6-terra medium .*/opt/joinerytech/terminals/explorer$'
